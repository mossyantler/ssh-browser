<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SSH Browser</title><link rel="stylesheet" href="ui.css"><script type="module" src="ui.js"></script></head><body data-view="popup"><div class="preview-banner" id="preview-banner" hidden>UI 미리보기 · 실제 SSH 연결 없음</div><div id="incognito-warning" class="incognito-warning" hidden>시크릿 모드에서는 사용할 수 없습니다.</div><main class="popup" id="app"><header class="popup-header"><a class="brand" href="options.html" id="popup-brand"><span class="brand-symbol" aria-hidden="true">↗</span><span>SSH <strong>Browser</strong></span></a><button class="icon-button" id="open-settings" title="호스트 관리" aria-label="호스트 관리 열기">⚙</button></header><section class="popup-route"><div class="eyebrow">CURRENT ROUTE</div><div class="route-heading"><strong id="status-title">상태 확인 중</strong><span class="status-pill" id="status-pill">확인 중</span></div><p id="status-description">브라우저 연결 상태를 확인합니다.</p></section><div class="error-panel" id="error-panel" role="alert" hidden><span id="error-text"></span><button class="text-button" id="retry-state">다시 확인</button></div><button class="local-option" id="local-button"><span class="local-option-icon">◎</span><span><strong>로컬 직접 연결</strong><small>SSH 프록시 없이 DIRECT 사용</small></span><span aria-hidden="true">↗</span></button><div class="popup-list-heading"><span>호스트로 전환</span><span id="result-count">0</span></div><label class="search-field popup-search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="호스트 검색" aria-label="호스트 검색"></label><div id="popup-host-list"></div><div class="popup-empty" id="empty-state" hidden>아직 저장된 호스트가 없습니다.<br><button class="text-button" id="empty-add">호스트 추가하기 ↗</button></div><footer class="popup-footer"><button class="text-button" id="stop-button">프록시 제어 해제</button><span id="helper-version">SSH Browser v0.1</span></footer></main><div class="toast" id="toast" role="status" hidden></div></body
